<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pixelfx · 像素特效库</title>
<meta name="description" content="用代码绘制的像素特效与动画，支持实时预览、调色与精灵表导出。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@400;500&family=Red+Hat+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--BODY-->
<header class="head">
  <div class="title">
    <svg class="mark" viewBox="0 0 7 7" shape-rendering="crispEdges" role="img" aria-label="Patch"><rect x="1" y="1" width="6" height="6" fill="#ffffff"/><rect x="0" y="0" width="3" height="3" fill="#f53cd1"/></svg>
    <div>
      <h1>pixelfx.</h1>
      <p class="sub"><span id="count">0</span> 种像素特效，均由代码绘制。</p>
    </div>
  </div>
  <nav class="links">
    <a href="https://github.com/patch-gg/pixelfx" target="_blank" rel="noopener">源码仓库</a>
    <a href="https://github.com/patch-gg/pixelfx#the-skill" target="_blank" rel="noopener">技能说明</a>
    <a href="https://patch.gg" target="_blank" rel="noopener">作者网站</a>
  </nav>
</header>
<div class="bar">
  <div class="bar-in">
    <div class="chips" id="chips" role="toolbar" aria-label="特效分类"></div>
    <input id="q" type="search" placeholder="搜索特效" aria-label="搜索特效" autocomplete="off">
  </div>
</div>
<main id="grid"></main>
<p class="empty" id="none" hidden>没有找到匹配的特效，试试“火焰”“斩击”或“循环”。</p>
<dialog class="detail" id="detail" aria-labelledby="d-name">
  <div class="sheet">
    <div>
      <div class="big"><canvas id="big"></canvas><button class="close" id="d-close" type="button">关闭</button></div>
    </div>
    <div class="info">
      <h2 id="d-name"></h2>
      <div class="id" id="d-id"></div>
      <p id="d-desc"></p>
      <dl class="facts" id="d-facts"></dl>
      <div class="controls">
        <div class="row"><label>播放</label><button class="btn" id="d-play" type="button">暂停</button><button class="btn" id="d-again" type="button">重播</button><span id="d-speed" class="row"></span></div>
        <div class="row"><label>背景</label><span id="d-bg" class="row"></span></div>
        <div class="palette-control">
          <div class="row"><span class="palette-label">调色板</span><button class="btn" id="d-pal-reset" type="button">恢复原色</button><button class="btn" id="d-seed" type="button">随机变化</button></div>
          <div id="d-pal" class="palette-presets" role="group" aria-label="预设调色板"></div>
          <div class="palette-label">自定义颜色 · 从暗到亮，点击色块修改</div>
          <div id="d-pal-colors" class="palette-colors" role="group" aria-label="自定义调色板"></div>
        </div>
        <div class="row"><label>显示</label><button class="btn" id="d-flip" type="button">镜像</button><button class="btn" id="d-actor" type="button">角色</button><button class="btn" id="d-make" type="button">生成精灵表</button></div>
      </div>
      <div class="code-head"><span>使用代码</span><span><a id="d-src" target="_blank" rel="noopener">查看源码</a> · <button class="btn" id="d-copy" type="button">复制</button></span></div>
      <pre id="d-code"></pre>
    </div>
    <div class="sheetout" id="d-sheet"></div>
  </div>
</dialog>
<!--/BODY-->
<script type="module" src="app.js"></script>
</body>
</html>
